<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Glyph Atelier</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>✳ Glyph Atelier</b><span> 文字を描いてフォントにしよう</span></div><div class="actions"><button id="save">保存</button><label class="button">開く<input id="load" type="file" accept=".json" hidden></label><button id="export" class="primary">OTFを書き出す</button></div></header><main><section class="characters"><div class="section-head"><strong>文字一覧</strong><span id="count"></span></div><div class="add"><input id="character" placeholder="文字を入力" aria-label="追加する文字"><button id="add">＋ 追加</button></div><button id="addDefaults" class="quiet">英数字・記号をまとめて追加</button><div id="glyphs" class="glyphs"></div><button id="deleteGlyph" class="quiet">選択中の文字を削除</button></section><section class="work"><div class="work-head"><div><span class="eyebrow">編集中の文字</span><h1 id="current">A</h1></div><div class="tools" aria-label="描画ツール"><button data-tool="pen" class="selected">✏️ ペン</button><button data-tool="line">╱ 直線</button><button data-tool="ellipse">◯ 円・楕円</button><button data-tool="curve">⌒ 曲線</button><button data-tool="edit">✥ 点を調整</button><button data-tool="eraser">◩ 消す</button></div></div><div class="options"><label>太さ <input id="size" type="range" min="5" max="240" value="65"><output id="sizeValue">65</output></label><label><input id="snap" type="checkbox"> グリッドに合わせる</label><label>間隔 <input id="step" type="number" min="1" max="200" value="25" style="width:65px"></label><button id="zoomIn">拡大＋</button><button id="zoomOut">縮小−</button><button id="zoomReset">全体</button><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button><button id="clear">文字を消去</button></div><div class="canvas-wrap"><svg id="canvas" viewBox="0 0 1000 1000" aria-label="文字の描画エリア"></svg></div><div class="hint" id="hint">指やペンでなぞって描こう。直線は始点から終点までドラッグ。</div><details><summary>下敷き・文字幅の設定</summary><div class="settings"><label>フォントを下敷き <input id="fontfile" type="file" accept=".ttf,.otf"></label><label>画像を下敷き <input id="imagefile" type="file" accept="image/*"></label><label><input id="refAuto" type="checkbox" checked> 編集中の文字に合わせる</label><label>下敷きの文字 <input id="refchar" value="A" size="3" disabled></label><small id="refStatus" role="status"></small><label>濃さ <input id="opacity" type="range" min="0" max="1" step=".05" value=".2"></label><label>文字幅 <input id="width" type="number" min="100" max="1500" value="800"></label><button id="removeRef">下敷きを外す</button></div></details></section><aside><div class="section-head"><strong>プレビュー</strong><span>LIVE</span></div><p>文字を並べたときの見た目</p><textarea id="sample" aria-label="プレビューする文章" rows="3">ABC abc 123</textarea><div id="preview" class="preview"></div><label class="family">フォント名<input id="family" value="My Font"></label><div class="help"><b>はじめかた</b><ol><li>文字一覧から文字を選ぶ</li><li>白い場所に指で描く</li><li>「OTFを書き出す」を押す</li></ol><small>保存したJSONは別の端末でも開けます。ブラウザのデータを消す前に保存してください。</small></div></aside></main><div id="toast" role="status"></div><script src="opentype.min.js"></script><script src="app.js"></script></body></html>
